  <g fill="#fff" stroke="#8A2432" stroke-width="3"><rect x="10" y="30" width="280" height="100" rx="2"/><rect x="400" y="30" width="280" height="100" rx="2"/><rect x="790" y="30" width="280" height="100" rx="2"/></g>
