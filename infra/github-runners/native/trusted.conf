# Restricted trusted-job service. This does NOT isolate jobs from each other.
[Service]
User=tdk-ci
Group=tdk-ci
WorkingDirectory=/var/lib/tdk-ci
ExecStart=
ExecStart=/var/lib/tdk-ci/runsvc.sh
Environment=HOME=/var/lib/tdk-ci
UMask=0077
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
PrivateTmp=yes
PrivateDevices=yes
ProtectHome=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/tdk-ci
ProtectProc=invisible
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
MemoryMax=6G
TasksMax=512
LimitCORE=0
KillMode=control-group
