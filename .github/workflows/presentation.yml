# Presentation execution is owned by ci.yml to share planning/runtime/evidence.
# This explicit manual entry remains for authenticated component-only diagnostics.
name: Presentation diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROME_PATH: /opt/google/chrome/chrome
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false
      - uses: actions/setup-python@main
        with:
          python-version: '3.x'
          check-latest: true
      - uses: actions/setup-node@main
        with:
          node-version: '*'
          check-latest: true
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python3 scripts/ci/run.py --component presentation
      - uses: actions/upload-artifact@main
        if: always()
        with:
          name: presentation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .project/checks/
          retention-days: 14
          if-no-files-found: error
