name: runner kit
on:
  pull_request:
    paths: ['infra/github-runners/**', '.github/workflows/runner-kit.yml']
  push:
    branches: [main, master]
    paths: ['infra/github-runners/**', '.github/workflows/runner-kit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s infra/github-runners/tests -v
      - run: bash -n infra/github-runners/prepare-image.sh
      - run: shellcheck infra/github-runners/prepare-image.sh
